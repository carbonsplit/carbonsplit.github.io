name: Sync GFF Trading Stats

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6:00 AM UTC (11:30 AM IST)
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Scrape GFF Dashboard
        env:
          GFF_EMAIL: ${{ secrets.GFF_EMAIL }}
          GFF_PASSWORD: ${{ secrets.GFF_PASSWORD }}
        run: node scripts/sync-gff-stats.js

      - name: Upload debug screenshot (if exists)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug-screenshot.png
          if-no-files-found: ignore

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/data/stats.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated stats
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stats.json
          git commit -m "Auto-sync trading stats from GFF dashboard"
          git push

      - name: Build and deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          npm run build
          npx gh-pages -d dist
